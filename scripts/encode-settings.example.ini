# encode-settings.ini: your machine's settings, read by every script here.
#
# Copy this file to encode-settings.ini in this folder, next to the scripts (git-ignored), or put
# it anywhere and point the ENCODE_SETTINGS environment variable at it. Everything is optional:
# a setting only fills in a parameter you didn't give on the command line, and the command
# line always wins.
#
#   Key = value      a parameter's name, without the dash (-DoviTool -> DoviTool)
#   [All]            keys for every script that has a parameter of that name
#   [Encode-Batch]   keys for that script only (any script's name works); they win over [All]
#   [compare_encode] read by compare_encode.sh in WSL (its environment-variable names)
#
# Switches take true/false (or yes/no, 1/0); lists are comma-separated. Values can start with
# ~ or $HOME, and use %VARIABLES%. Quotes around a value are optional. Lines starting with #
# or ; are comments (there are no comments at the end of a line: # can be part of a path).
# Per-run parameters (Source, Dest, WorkDir, Output, ...) and hashtables (-Ladder,
# -Variants) can't be set here.
#
# Windows paths are mapped into WSL by drive letter (L:\Library -> /mnt/l/Library, with
# WslMountRoot), so nothing needs to be listed twice.

[All]
# Programs: a full path, or a name found on PATH (the defaults).
# NVEncC = %APPDATA%\NVEnc\NVEncC64.exe
# DoviTool = C:\Tools\dovi_tool\dovi_tool.exe
# VsPipe = C:\Tools\vapoursynth-portable\vspipe.exe
# MkvMerge = C:\Program Files\MKVToolNix\mkvmerge.exe
# SeConv = C:\Tools\SubtitleEdit\seconv.exe

# WSL: which distribution, and where Windows drives are mounted in it.
# WslDistro = Ubuntu
# WslMountRoot = /mnt
# When a drive isn't visible in WSL (network drives' mounts drop), it's mounted again as root
# (wsl -u root mount -t drvfs X: /mnt/x). To run your own command instead, as your user:
# RemountCmd = my-remount

[Encode-Batch]
# Threads = 1
# BakeThreads = -1
# DoviThreads = 1
# NearMissPct = 1
# SkipCommentaries = false
# WSL commands (on PATH for a login shell, or full paths)
# CompareEncodeCmd = compare_encode
# DoviConvertCmd = dovi_convert

[Add-BluRayAudio]
# Ac3StereoBitrate = 320
# FewestChannelsFirst = false

[compare_encode]
# Keys: FFMPEG FFMPEG_CUDA CLIP SUB THREADS MODEL MODEL_4K_MIN_WIDTH SIZE_SCOPE VMAF_CUDA
# CUDA_FMT CUDA_DEVICE CUDA_DECODE REF_CFR SHIFT_MAX PROBE_LEN (see compare_encode.sh's header).
# An environment variable that's already set wins.
# FFMPEG = /usr/local/bin/ffmpeg
# FFMPEG_CUDA = /opt/ffmpeg-cuda/bin/ffmpeg
# VMAF_CUDA = auto
